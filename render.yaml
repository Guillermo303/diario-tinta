services:
  - type: web
    name: diario-tinta
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      # Direcciones de la versión anterior en HTML
      - type: redirect
        source: /index.html
        destination: /
      - type: redirect
        source: /pensar.html
        destination: /escribir
      - type: redirect
        source: /hablar.html
        destination: /hablar
      - type: redirect
        source: /ajustes.html
        destination: /ajustes
      - type: redirect
        source: /chats.html
        destination: /
      # Rutas de React: cualquier otra dirección carga la app
      - type: rewrite
        source: /*
        destination: /index.html
